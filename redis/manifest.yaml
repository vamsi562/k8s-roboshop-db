# service, headless service, statefulset, persistent volume claim
apiVersion: v1 #service
kind: Service
metadata:
  name: redis
  namespace: roboshop
spec:
  selector:
    purpose: roboshop
    component: redis
    tier: db
  ports:
    - protocol: TCP
      port: 6379 #servicePort
      targetPort: 6379 #containerPort

---
apiVersion: v1 #headless service
kind: Service
metadata:
  name: redis-headless
  namespace: roboshop
spec:
  clusterIP: None #headless service
  selector:
    purpose: roboshop
    component: redis
    tier: db
  ports:
    - protocol: TCP
      port: 6379 #servicePort
      targetPort: 6379 #containerPort

---
apiVersion: storage.k8s.io/v1 #storage class
kind: StorageClass
metadata:
  name: redis-storage-class
provisioner: ebs.csi.aws.com
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: roboshop
spec:
  selector:
    matchLabels:
      purpose: roboshop
      component: redis
      tier: db # has to match .spec.template.metadata.labels
  serviceName: "redis-headless" # headless service name has to match the serviceName in stateful set
  replicas: 1 # by default is 1
  template:
    metadata:
      labels:
        purpose: roboshop
        component: redis
        tier: db
    spec:
      containers:
        - name: redis
          image: redis:7.0
          imagePullPolicy: Always
          readinessProbe: # check if application is ready to serve requests
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe: # check if application is alive or not.
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - name: redis
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "storage-class" #storage class name
        resources:
          requests:
            storage: 1Gi
