# service, headless service, statefulset, persistent volume claim
apiVersion: v1 #service
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
spec:
  selector:
    purpose: roboshop
    component: mongodb
    tier: db
  ports:
    - protocol: TCP
      port: 27017 #servicePort
      targetPort: 27017 #containerPort

---
apiVersion: v1 #headless service
kind: Service
metadata:
  name: mongodb-headless
  namespace: roboshop
spec:
  clusterIP: None #headless service
  selector:
    purpose: roboshop
    component: mongodb
    tier: db
  ports:
    - protocol: TCP
      port: 27017 #servicePort
      targetPort: 27017 #containerPort

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: roboshop
spec:
  selector:
    matchLabels:
      purpose: roboshop
      component: mongodb
      tier: db # has to match .spec.template.metadata.labels
  serviceName: "mongodb-headless" # headless service name has to match the serviceName in stateful set
  replicas: 1 # by default is 1
  template:
    metadata:
      labels:
        purpose: roboshop
        component: mongodb
        tier: db
    spec:
      containers:
        - name: mongodb
          image: vamsi562/mongodb:v1
          imagePullPolicy: Always
          readinessProbe: # check if application is ready to serve requests
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe: # check if application is alive or not.
            tcpSocket:
              port: 27017
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - name: mongodb
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongodb
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "storage-class" #storage class name
        resources:
          requests:
            storage: 1Gi
