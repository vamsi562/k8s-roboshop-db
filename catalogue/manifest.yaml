---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    purpose: roboshop
    component: catalogue
    tier: backend
data:
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  labels:
    purpose: roboshop
    component: catalogue
    tier: backend
  namespace: roboshop
spec:
  # Specify replicas to be created
  replicas: 2
  selector:
    matchLabels:
      purpose: roboshop
      component: catalogue
      tier: backend
  template:
    # pod definition
    metadata:
      labels:
        purpose: roboshop
        component: catalogue
        tier: backend
    spec:
      containers:
        - name: catalogue
          image: vamsi562/catalogue:v1
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: catalogue
          ports:
            - name: liveness-port
              containerPort: 8080
          resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
            limits:
              memory: "200Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 1
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 1
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: roboshop
spec:
  selector:
    purpose: roboshop
    component: catalogue
    tier: backend
  ports:
    - protocol: TCP
      port: 8080 #servicePort
      targetPort: 8080 #containerPort

--- #horizontal pod autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    purpose: roboshop
    component: catalogue
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalogue
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 5
