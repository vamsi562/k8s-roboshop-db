# service, headless service, statefulset, persistent volume claim
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    purpose: roboshop
    component: rabbitmq
    tier: db
data:
  RABBITMQ_DEFAULT_USER: "roboshop"
  RABBITMQ_DEFAULT_PASS: "roboshop123"
---
apiVersion: v1 #service
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop
spec:
  selector:
    purpose: roboshop
    component: rabbitmq
    tier: db
  ports:
    - protocol: TCP
      port: 5672 #servicePort
      targetPort: 5672 #containerPort

---
apiVersion: v1 #headless service
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: roboshop
spec:
  clusterIP: None #headless service
  selector:
    purpose: roboshop
    component: rabbitmq
    tier: db
  ports:
    - protocol: TCP
      port: 5672 #servicePort
      targetPort: 5672 #containerPort

---
apiVersion: storage.k8s.io/v1 #storage class
kind: StorageClass
metadata:
  name: rabbitmq-storage-class
provisioner: ebs.csi.aws.com
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: roboshop
spec:
  selector:
    matchLabels:
      purpose: roboshop
      component: rabbitmq
      tier: db # has to match .spec.template.metadata.labels
  serviceName: "rabbitmq-headless" # headless service name has to match the serviceName in stateful set
  replicas: 1 # by default is 1
  template:
    metadata:
      labels:
        purpose: roboshop
        component: rabbitmq
        tier: db
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3
          imagePullPolicy: Always
          volumeMounts:
            - name: rabbitmq
              mountPath: /var/lib/rabbitmq
          envFrom:
            - configMapRef:
                name: rabbitmq
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 15
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "rabbitmq-storage-class" #storage class name
        resources:
          requests:
            storage: 1Gi
